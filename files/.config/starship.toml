# Starship prompt configuration shipped by the stempler cvm-profile.
# Docs: https://starship.rs/config/
#
# Tuned for the code-vm agent sandbox: it makes clear which VM you are on,
# shows the working directory and git state, how long the last command took,
# and whether it succeeded. Symbols are kept to widely-supported Unicode so the
# prompt renders without a Nerd Font installed.

# Two-line prompt (command line separated from the input character) with a
# blank line before each new prompt — easier to read in long agent sessions.
add_newline = true

format = """
$hostname\
$directory\
$git_branch\
$git_status\
${custom.mise_env}\
$cmd_duration\
$line_break\
$character"""

# Always show the host so it is obvious you are inside the sandbox VM, not on
# the host machine.
[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold yellow"
trim_at = "."

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = ""
format = "[$branch]($style) "
style = "bold magenta"

[git_status]
style = "bold red"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Active mise environment(s), shown inline in the main prompt (between git and
# command duration). Reuse stempler/config.fish's detection rather than
# duplicating it. Sourcing the function file under `fish --no-config` avoids
# re-running conf.d (which would re-activate mise and re-init starship) on every
# prompt. Starship feeds the command to the shell on stdin, so the shell list
# must NOT include `-c`.
#
# `when` gates display: with no named env active it exits non-zero and Starship
# drops the whole module — format literals, including the trailing space, and
# all — so the surrounding modules keep single-spacing. That gating is what
# lets the trailing space live in `format`: Starship strips trailing whitespace
# from a command's `$output`, so the separator cannot come from the command.
[custom.mise_env]
description = "Active mise environment(s), from stempler/config.fish"
shell = ["fish", "--no-config"]
when = "source ~/.config/fish/functions/__mise_env_active.fish; __mise_env_active | grep -q ."
command = "source ~/.config/fish/functions/__mise_env_active.fish; __mise_env_active | paste -sd,"
# Wrap the env name in literal parentheses (escaped so Starship treats them as
# text, not its conditional-group syntax) and colour the whole thing blue.
# Parentheses distinguish it from the bracketed git status; plain `blue`
# survives terminals that ignore dim/bright SGR codes.
format = "[\\($output\\)]($style) "
style = "blue"
