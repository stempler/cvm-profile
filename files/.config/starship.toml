# Starship prompt configuration shipped by the stempler cvm-profile.
# Docs: https://starship.rs/config/
#
# Tuned for the code-vm agent sandbox: it makes clear which VM you are on,
# shows the working directory and git state, how long the last command took,
# and whether it succeeded. Symbols are kept to widely-supported Unicode so the
# prompt renders without a Nerd Font installed.

# Two-line prompt (command line separated from the input character) with a
# blank line before each new prompt — easier to read in long agent sessions.
add_newline = true

format = """
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

# Right prompt: the active mise environment(s), mirroring where
# stempler/config.fish's fish_right_prompt showed them (Starship owns
# fish_right_prompt, so the indicator has to live here to survive).
# This must stay a top-level key — keep it above the first [table] header.
right_format = "${custom.mise_env}"

# Always show the host so it is obvious you are inside the sandbox VM, not on
# the host machine.
[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold yellow"
trim_at = "."

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = ""
format = "[$branch]($style) "
style = "bold magenta"

[git_status]
style = "bold red"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Reuse stempler/config.fish's detection rather than duplicating it. Sourcing
# the function file under `fish --no-config` avoids re-running conf.d (which
# would re-activate mise and re-init starship) on every prompt. Starship feeds
# `command` to the shell on stdin, so the shell list must NOT include `-c`. The
# command prints the "mise:<envs>" label itself, or nothing when no named env
# is active, so the module renders empty (Starship drops it entirely, spaces
# included) in the common case.
[custom.mise_env]
description = "Active mise environment(s), from stempler/config.fish"
shell = ["fish", "--no-config"]
command = "source ~/.config/fish/functions/__mise_env_active.fish; set -l e (__mise_env_active | paste -sd,); test -n \"$e\"; and printf 'mise:%s' \"$e\""
when = "true"
# No literal text outside $output: when no env is active the command prints
# nothing and the module renders as the empty string (a trailing space here
# would otherwise leak into the right prompt).
format = "[$output]($style)"
style = "cyan"
